<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FlowNote" />
  <title>FlowNote — 개인·업무 통합 스케줄러</title>

  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },
          colors: {
            canvas: '#FAF9F6',
            surface: '#FFFFFF',
            subtle: '#F3F2EE',
            ink: '#1C1B18',
            muted: '#6E6D68',
            line: '#E6E4DD',
          }
        }
      }
    }
  </script>

  <style>
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #FAF9F6;
      color: #1C1B18;
      overscroll-behavior-y: none;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #DCD9D0;
      border-radius: 999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .card-shadow {
      box-shadow: 0 1px 3px rgba(28, 27, 24, 0.04), 0 1px 2px rgba(28, 27, 24, 0.02);
    }
    .card-shadow:hover {
      box-shadow: 0 4px 12px rgba(28, 27, 24, 0.06);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-stone-200 pb-36">

  <!-- ==================== 상단 네비게이션 바 ==================== -->
  <header class="sticky top-0 z-30 bg-[#FAF9F6]/90 backdrop-blur-md border-b border-[#E6E4DD]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-2">
      
      <!-- 좌측: 로고 및 실시간 동기화 상태 -->
      <div class="flex items-center gap-2.5 shrink-0">
        <div class="w-7 h-7 rounded-lg bg-[#1C1B18] text-white flex items-center justify-center font-bold text-sm tracking-tight">
          F
        </div>
        <span class="font-semibold text-[15px] tracking-tight text-[#1C1B18]">FlowNote</span>
        <span id="syncBadge" title="클라우드 동기화 상태" class="inline-flex items-center gap-1.5 text-[11px] font-medium px-2 py-0.5 rounded-full bg-[#F3F2EE] text-[#6E6D68]">
          <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
          <span id="syncText">로컬 모드</span>
        </span>
      </div>

      <!-- 중앙: 카테고리 필터 -->
      <nav id="categoryNav" class="flex items-center gap-1 overflow-x-auto no-scrollbar py-1">
        <!-- JS로 렌더링 -->
      </nav>

      <!-- 우측: 비전 바 토글 & 세로 점(⋮) 설정 메뉴 -->
      <div class="flex items-center gap-1.5 shrink-0 relative">
        <button id="toggleVisionBtn" onclick="toggleVisionBar()" class="text-xs font-medium px-2.5 py-1.5 rounded-lg bg-[#F3F2EE] hover:bg-[#E8E6DF] text-[#1C1B18] transition flex items-center gap-1.5">
          <span>비전 · KPI</span>
          <svg id="visionChevron" class="w-3.5 h-3.5 text-[#6E6D68] transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- 세로 점 세 개(⋮) 설정 버튼 -->
        <div class="relative">
          <button id="moreMenuBtn" onclick="toggleMoreMenu(event)" aria-label="설정 및 더보기" class="relative w-8 h-8 rounded-lg hover:bg-[#F3F2EE] flex items-center justify-center text-[#1C1B18] transition">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <circle cx="8" cy="3" r="1.4" />
              <circle cx="8" cy="8" r="1.4" />
              <circle cx="8" cy="13" r="1.4" />
            </svg>
            <span id="gcalActiveDot" class="hidden absolute bottom-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-emerald-500 ring-2 ring-[#FAF9F6]"></span>
          </button>

          <!-- 드롭다운 메뉴 -->
          <div id="moreMenuDropdown" class="hidden absolute right-0 mt-2 w-64 bg-white rounded-xl border border-[#E6E4DD] shadow-lg py-1.5 z-50 text-xs">
            <div class="px-3.5 py-2 border-b border-[#F3F2EE]">
              <p class="font-semibold text-[#1C1B18]">워크스페이스 설정</p>
              <p id="dropdownSyncInfo" class="text-[11px] text-[#6E6D68] mt-0.5">클라우드 키를 연결하면 PC-
